<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Tracking - PadLock</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f8f9fa;color:#333;line-height:1.6;min-height:100vh}
.header{background:#fff;border-bottom:1px solid #e9ecef;padding:16px 0;text-align:center}
.header h1{font-size:1.5rem;color:#1a1a2e}
.header h1 span{color:#00d4aa}
.container{max-width:560px;margin:0 auto;padding:32px 20px}
/* 查询卡片 */
.lookup-card{background:#fff;border-radius:12px;padding:32px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.lookup-card h2{font-size:1.15rem;color:#333;margin-bottom:6px}
.lookup-card p.desc{font-size:.85rem;color:#888;margin-bottom:24px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:.82rem;font-weight:600;color:#555;margin-bottom:5px}
.form-group input{width:100%;padding:10px 14px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:.95rem;transition:border-color .2s;outline:none}
.form-group input:focus{border-color:#00d4aa}
.form-group .hint{font-size:.75rem;color:#999;margin-top:4px}
.btn-lookup{width:100%;padding:12px;background:linear-gradient(135deg,#ff6b35,#f97316);color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;transition:opacity .2s;margin-top:8px}
.btn-lookup:hover{opacity:.9}
.btn-lookup:disabled{opacity:.5;cursor:not-allowed}
/* 错误提示 */
.error-msg{background:#fff0f0;color:#d32f2f;padding:12px 16px;border-radius:8px;font-size:.85rem;margin-top:16px;display:none}
.error-msg.show{display:block}
/* 订单卡片 */
.order-card{background:#fff;border-radius:12px;padding:28px;margin-top:20px;box-shadow:0 2px 12px rgba(0,0,0,.06);border-left:4px solid #00d4aa}
.order-card:not(:first-of-type){margin-top:16px}
.order-header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.order-no{font-size:.9rem;font-weight:700;color:#1a1a2e;font-family:monospace}
.order-status{display:inline-block;padding:3px 12px;border-radius:20px;font-size:.75rem;font-weight:600;text-transform:uppercase}
.status-pending{background:#fff3e0;color:#e65100}
.status-completed{background:#e8f5e9;color:#2e7d32}
.status-cancelled{background:#fce4ec;color:#c62828}
.order-body{display:grid;grid-template-columns:1fr 1fr;gap:14px 24px}
.order-body .field{}
.order-body .label{font-size:.75rem;color:#888;text-transform:uppercase;letter-spacing:.5px}
.order-body .value{font-size:.9rem;color:#333;font-weight:500;margin-top:2px;word-break:break-word}
.order-body .full{grid-column:1/-1}
.order-divider{grid-column:1/-1;border-top:1px dashed #e0e0e0;margin:4px 0}
.order-footer{margin-top:16px;padding-top:14px;border-top:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center}
.order-time{font-size:.78rem;color:#aaa}
.order-total{font-size:1.2rem;font-weight:700;color:#ff6b35}
/* 结果统计 */
.result-info{font-size:.85rem;color:#888;margin-top:16px;text-align:center}
/* 加载动画 */
.spinner{display:none;width:20px;height:20px;border:2.5px solid #e0e0e0;border-top-color:#ff6b35;border-radius:50%;animation:spin .6s linear infinite;margin:16px auto}
@keyframes spin{to{transform:rotate(360deg)}}
/* 页脚 */
.footer{text-align:center;padding:24px;font-size:.78rem;color:#aaa}
/* 响应式 */
@media(max-width:480px){.order-body{grid-template-columns:1fr}.container{padding:16px 12px}.lookup-card{padding:20px}}
</style>
</head>
<body>

<div class="header">
  <h1><span>PadLock</span> Order Tracking</h1>
</div>

<div class="container">

  <!-- 查询表单 -->
  <div class="lookup-card">
    <h2>Track Your Order</h2>
    <p class="desc">Enter your email or order number (PL-xxx) to look up your order.</p>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label for="orderId">Order Number</label>
      <input type="text" id="orderId" placeholder="PL-20260812-1234" autocomplete="off">
      <div class="hint">At least one field is required</div>
    </div>
    <button class="btn-lookup" id="lookupBtn" onclick="lookupOrder()">Look Up Order</button>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <!-- 加载指示器 -->
  <div class="spinner" id="spinner"></div>

  <!-- 结果容器 -->
  <div id="results"></div>

  <!-- 结果统计 -->
  <div class="result-info" id="resultInfo"></div>

</div>

<div class="footer">&copy; 2026 PadLock Smart Fingerprint Padlock</div>

<script>
// ============ API 地址（开发环境 localhost:3000，生产环境修改为实际域名） ============
var API_BASE = 'http://localhost:3000';

// ============ 提交查询 ============
function lookupOrder() {
  var email = document.getElementById('email').value.trim();
  var orderId = document.getElementById('orderId').value.trim();
  var errorEl = document.getElementById('errorMsg');
  var resultsEl = document.getElementById('results');
  var resultInfoEl = document.getElementById('resultInfo');
  var spinner = document.getElementById('spinner');
  var btn = document.getElementById('lookupBtn');

  // 清除旧结果
  errorEl.classList.remove('show');
  resultsEl.innerHTML = '';
  resultInfoEl.innerHTML = '';

  // 至少一个字段有值
  if (!email && !orderId) {
    errorEl.textContent = 'Please enter your email or order number.';
    errorEl.classList.add('show');
    return;
  }

  // 加载状态
  btn.disabled = true;
  spinner.style.display = 'block';

  // 发起查询
  fetch(API_BASE + '/api/orders/lookup', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email, order_id: orderId })
  })
  .then(function(res) { return res.json(); })
  .then(function(data) {
    spinner.style.display = 'none';
    btn.disabled = false;

    if (data.error) {
      errorEl.textContent = data.error;
      errorEl.classList.add('show');
      return;
    }

    // 渲染订单卡片
    var orders = data.orders;
    resultInfoEl.textContent = 'Found ' + data.count + ' order(s)';
    orders.forEach(function(order) {
      resultsEl.innerHTML += buildOrderCard(order);
    });
  })
  .catch(function(err) {
    spinner.style.display = 'none';
    btn.disabled = false;
    errorEl.textContent = 'Network error. Please make sure the server is running and try again.';
    errorEl.classList.add('show');
    console.error(err);
  });
}

// ============ 构建订单卡片 HTML ============
function buildOrderCard(order) {
  var statusClass = 'status-' + order.status;
  var statusLabel = order.status.charAt(0).toUpperCase() + order.status.slice(1);

  return '<div class="order-card">' +
    '<div class="order-header">' +
      '<span class="order-no">' + escapeHtml(order.order_no) + '</span>' +
      '<span class="order-status ' + statusClass + '">' + escapeHtml(statusLabel) + '</span>' +
    '</div>' +
    '<div class="order-body">' +
      '<div class="field">' +
        '<div class="label">Product</div>' +
        '<div class="value">' + escapeHtml(order.product_model) + ' x' + order.quantity + '</div>' +
      '</div>' +
      '<div class="field">' +
        '<div class="label">Unit Price</div>' +
        '<div class="value">$' + order.product_price.toFixed(2) + '</div>' +
      '</div>' +
      '<div class="field">' +
        '<div class="label">Customer</div>' +
        '<div class="value">' + escapeHtml(order.customer_name) + '</div>' +
      '</div>' +
      '<div class="field">' +
        '<div class="label">Email</div>' +
        '<div class="value">' + escapeHtml(order.email) + '</div>' +
      '</div>' +
      '<div class="order-divider"></div>' +
      '<div class="field full">' +
        '<div class="label">Shipping Address</div>' +
        '<div class="value">' + escapeHtml(order.address + ', ' + order.city + ', ' + order.country) + '</div>' +
      '</div>' +
      (order.notes ? '<div class="field full"><div class="label">Notes</div><div class="value">' + escapeHtml(order.notes) + '</div></div>' : '') +
    '</div>' +
    '<div class="order-footer">' +
      '<span class="order-time">' + order.created_at + '</span>' +
      '<span class="order-total">$' + order.total_amount.toFixed(2) + '</span>' +
    '</div>' +
  '</div>';
}

// ============ HTML 转义（XSS 防护） ============
function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// 回车键触发查询
document.getElementById('email').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') lookupOrder();
});
document.getElementById('orderId').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') lookupOrder();
});
</script>

</body>
</html>
